name: Fork PR Tests (Key-Free)

# Fast, deterministic fork checks. Real-provider, MCP, vector-store, ClickHouse
# and other optional-backend suites remain manual.
on:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and key-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bifrost
          POSTGRES_PASSWORD: bifrost_password
          POSTGRES_DB: bifrost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bifrost -d bifrost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Set up workspace
        run: source ./.github/workflows/scripts/setup-go-workspace.sh

      - name: Build fork code
        run: |
          mkdir -p transports/bifrost-http/ui
          echo stub > transports/bifrost-http/ui/index.html
          go build ./core/... ./framework/... ./transports/...

      - name: Test core and schemas
        run: go test -short -timeout 10m ./core ./core/schemas/...

      - name: Test Postgres config store
        run: go test -timeout 20m ./framework/configstore/...

      - name: Test plugins
        run: make test-plugins
